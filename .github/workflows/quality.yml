name: GLHF - Static quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restaurar y compilar
        run: |
          dotnet restore GLHF.csproj
          dotnet build GLHF.csproj -c Release --no-restore
      - name: Generar y verificar contenido
        run: |
          dotnet run --project GLHF.csproj -c Release --no-build
          dotnet run --project GLHF.csproj -c Release --no-build -- --verify
      - name: Revisar sintaxis JavaScript
        run: |
          node --check wwwroot/assets/js/site.js
          node --check wwwroot/assets/js/bootstrap.js
          node --check wwwroot/assets/js/mejoras.js
          node --check wwwroot/assets/js/legal.js
      - name: Comprobar requisitos de publicacion
        shell: bash
        run: |
          test -f artifacts/site/.nojekyll
          test -f artifacts/site/index.html
          test -f artifacts/site/assets/css/retro.css
          test ! -e artifacts/site/_framework
          test ! -e artifacts/site/sw.js
          ! grep -R '/GLHF/' artifacts/site --include='*.html' --include='*.js'
