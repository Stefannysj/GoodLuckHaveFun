name: GLHF - Static .NET generator and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restaurar dependencias
        run: dotnet restore GLHF.csproj
      - name: Compilar generador
        run: dotnet build GLHF.csproj -c Release --no-restore
      - name: Generar unico index.html publicable
        run: dotnet run --project GLHF.csproj -c Release --no-build
      - name: Verificar rutas, licencias y estructura HTML
        run: dotnet run --project GLHF.csproj -c Release --no-build -- --verify
      - name: Verificar sintaxis JavaScript
        run: |
          node --check wwwroot/assets/js/site.js
          node --check wwwroot/assets/js/bootstrap.js
          node --check wwwroot/assets/js/mejoras.js
          node --check wwwroot/assets/js/legal.js
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
